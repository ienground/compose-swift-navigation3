name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  ci:
    name: 배포 전 검증
    uses: ./.github/workflows/gradle.yml

  publish:
    name: Maven Central 자동 배포
    needs: ci
    runs-on: macos-latest
    steps:
      - name: 릴리스 코드 가져오기
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - name: 릴리스 태그와 버전 확인
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(sed -n 's/^lib-version-name = "\([^"]*\)"/\1/p' gradle/libs.versions.toml)
          if [[ -z "$version" || "$RELEASE_TAG" != "v$version" ]]; then
            echo "::error::릴리스 태그($RELEASE_TAG)는 버전 카탈로그의 v$version 과 일치해야 합니다."
            exit 1
          fi
      - name: 배포 Secret 확인
        shell: bash
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          GPG_KEY: ${{ secrets.GPG_KEY }}
          GPG_PASSWORD: ${{ secrets.GPG_PASSWORD }}
        run: |
          for secret_name in SONATYPE_USERNAME SONATYPE_PASSWORD GPG_KEY GPG_PASSWORD; do
            if [[ -z "${!secret_name}" ]]; then
              echo "::error::$secret_name Secret이 등록되지 않았습니다."
              exit 1
            fi
          done
      # Matches gradle/gradle-daemon-jvm.properties, so the Gradle daemon does not need to be provisioned
      - name: JDK 설정
        uses: actions/setup-java@v6
        with:
          distribution: 'jetbrains'
          java-version: '25'
      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v6
      - name: Maven Central에 업로드하고 자동 공개
        run: ./gradlew :library:publishToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSWORD }}
